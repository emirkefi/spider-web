<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="50%" stop-color="#11131C" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>

    <radialGradient id="glowBlue" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="78%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#BF5AF2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#BF5AF2" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#BF5AF2" />
      <stop offset="75%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#30D158" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="60%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <style>
      .web-ring {
        transform-origin: 200px 190px;
        animation: pulseWeb 6s ease-in-out infinite;
      }
      .spider-emblem {
        transform-origin: 200px 190px;
        animation: floatSpider 4s ease-in-out infinite;
      }
      .card-float-1 {
        animation: slideCard1 5s ease-in-out infinite;
      }
      .card-float-2 {
        animation: slideCard2 5s ease-in-out infinite;
      }
      .scan-line {
        animation: scanGlow 4s linear infinite;
      }
      @keyframes pulseWeb {
        0%, 100% { opacity: 0.16; transform: scale(1); }
        50% { opacity: 0.32; transform: scale(1.04); }
      }
      @keyframes floatSpider {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes slideCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes slideCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(5px); }
      }
      @keyframes scanGlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .title-font {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Outer Rounded Banner Frame -->
  <rect x="2" y="2" width="1196" height="376" rx="28" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2" />
  <rect x="2" y="2" width="1196" height="376" rx="28" fill="url(#glowBlue)" />
  <rect x="2" y="2" width="1196" height="376" rx="28" fill="url(#glowPurple)" />

  <!-- Animated Background Spiderweb Geometry around Left Emblem -->
  <g class="web-ring" stroke="#38BDF8" stroke-width="1.2">
    <line x1="200" y1="30" x2="200" y2="350" stroke-opacity="0.35" />
    <line x1="40" y1="190" x2="360" y2="190" stroke-opacity="0.35" />
    <line x1="85" y1="75" x2="315" y2="305" stroke-opacity="0.35" />
    <line x1="315" y1="75" x2="85" y2="305" stroke-opacity="0.35" />
    <polygon points="200,60 292,98 330,190 292,282 200,320 108,282 70,190 108,98" fill="none" />
    <polygon points="200,100 264,126 290,190 264,254 200,280 136,254 110,190 136,126" fill="none" />
  </g>

  <!-- Animated Sharp Black Spider Squircle Emblem -->
  <g class="spider-emblem" transform="translate(122, 112) scale(0.305)">
    <rect x="20" y="20" width="472" height="472" rx="115" fill="url(#badgeMetal)" stroke="#09090B" stroke-width="18" />
    <g fill="#09090B">
      <path d="M232 198 L172 122 L118 64 L148 138 L218 214 Z" />
      <path d="M222 222 L130 162 L54 142 L120 190 L216 238 Z" />
      <path d="M222 248 L120 244 L48 294 L132 270 L224 264 Z" />
      <path d="M230 272 L148 338 L104 444 L174 350 L240 284 Z" />
      <path d="M280 198 L340 122 L394 64 L364 138 L294 214 Z" />
      <path d="M290 222 L382 162 L458 142 L392 190 L296 238 Z" />
      <path d="M290 248 L392 244 L464 294 L380 270 L288 264 Z" />
      <path d="M282 272 L364 338 L408 444 L338 350 L272 284 Z" />
      <polygon points="244,174 230,134 250,156" />
      <polygon points="268,174 282,134 262,156" />
      <polygon points="256,158 290,190 278,248 234,248 222,190" />
      <polygon points="256,236 312,288 288,386 256,442 224,386 200,288" />
    </g>
    <polygon points="256,262 270,298 256,388 242,298" fill="#52525B" opacity="0.65" />
    <polygon points="242,186 252,194 240,200" fill="#FFFFFF" />
    <polygon points="270,186 260,194 272,200" fill="#FFFFFF" />
  </g>

  <!-- Center Title & Tagline -->
  <g transform="translate(335, 118)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="256" height="28" rx="14" fill="#0A84FF" fill-opacity="0.14" stroke="#0A84FF" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4" fill="#30D158" />
    <text x="28" y="18" class="mono-font" fill="#93C5FD" font-size="11" font-weight="600" letter-spacing="0.8">
      NATIVE WAYLAND &amp; HYPRLAND WORKFLOW
    </text>

    <!-- Main Heading -->
    <text x="0" y="76" class="title-font" fill="url(#textGrad)" font-size="54" font-weight="800" letter-spacing="-1.5">
      SpiderWeb
    </text>

    <!-- Subtitle -->
    <text x="0" y="112" class="title-font" fill="#A1A1AA" font-size="17" font-weight="400">
      High-velocity Kanban, Code Review pipeline &amp; real-time analytics for Linux
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 138)" class="mono-font" font-size="11" font-weight="500">
      <rect x="0" y="0" width="96" height="26" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="14" y="17" fill="#E4E4E7">To Do → Done</text>

      <rect x="106" y="0" width="118" height="26" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="120" y="17" fill="#C084FC">PR Code Review</text>

      <rect x="234" y="0" width="108" height="26" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="248" y="17" fill="#34D399">GTK4 Native</text>

      <rect x="352" y="0" width="118" height="26" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="366" y="17" fill="#FBBF24">Keyboard-First</text>
    </g>
  </g>

  <!-- Right Side Animated Mini Kanban Preview Cards -->
  <g transform="translate(910, 66)">
    <!-- Column 1 Card -->
    <g class="card-float-1">
      <rect x="0" y="0" width="235" height="106" rx="16" fill="#18181B" fill-opacity="0.9" stroke="#27272A" stroke-width="1.5" />
      <circle cx="20" cy="22" r="4" fill="#0A84FF" />
      <text x="32" y="26" class="mono-font" fill="#93C5FD" font-size="10" font-weight="600">IN PROGRESS • TSK-101</text>
      <text x="16" y="50" class="title-font" fill="#F4F4F5" font-size="12" font-weight="600">Wayland layer-shell blur pass</text>
      <rect x="16" y="66" width="110" height="22" rx="6" fill="#0A84FF" fill-opacity="0.15" />
      <text x="26" y="81" class="mono-font" fill="#60A5FA" font-size="10">Due in 5h</text>
      <rect x="136" y="66" width="82" height="22" rx="6" fill="#30D158" fill-opacity="0.15" />
      <text x="148" y="81" class="mono-font" fill="#4ADE80" font-size="10">WS 1 • 75%</text>
    </g>

    <!-- Column 2 Card -->
    <g class="card-float-2" transform="translate(0, 124)">
      <rect x="0" y="0" width="235" height="106" rx="16" fill="#18181B" fill-opacity="0.9" stroke="#3B0764" stroke-width="1.5" />
      <circle cx="20" cy="22" r="4" fill="#BF5AF2" />
      <text x="32" y="26" class="mono-font" fill="#D8B4FE" font-size="10" font-weight="600">IN REVIEW (CODE) • PR #118</text>
      <text x="16" y="50" class="title-font" fill="#F4F4F5" font-size="12" font-weight="600">Unix socket2 workspace IPC</text>
      <rect x="16" y="66" width="126" height="22" rx="6" fill="#BF5AF2" fill-opacity="0.16" />
      <text x="26" y="81" class="mono-font" fill="#C084FC" font-size="10">fix/socket2-buffer</text>
      <rect x="150" y="66" width="68" height="22" rx="6" fill="#27272A" />
      <text x="162" y="81" class="mono-font" fill="#E4E4E7" font-size="10">Verified</text>
    </g>
  </g>

  <!-- Animated Bottom Energy Divider Line -->
  <line x1="80" y1="362" x2="1120" y2="362" stroke="url(#accentLine)" stroke-width="2.5" stroke-dasharray="120 20" class="scan-line" />
</svg>
