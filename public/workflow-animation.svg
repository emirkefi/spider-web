<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220" fill="none">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717A" />
      <stop offset="33%" stop-color="#0A84FF" />
      <stop offset="66%" stop-color="#BF5AF2" />
      <stop offset="100%" stop-color="#30D158" />
    </linearGradient>

    <style>
      .flow-dash {
        stroke-dasharray: 10 8;
        animation: flowMove 1.8s linear infinite;
      }
      .pulse-node {
        animation: nodeGlow 2.6s ease-in-out infinite;
      }
      @keyframes flowMove {
        to { stroke-dashoffset: -36; }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      .font-ui {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .font-code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
    </style>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="22" fill="#0B0C10" stroke="#27272A" stroke-width="2" />

  <!-- Connecting Animated Flow Line -->
  <line x1="140" y1="110" x2="860" y2="110" stroke="url(#pipeGrad)" stroke-width="3" class="flow-dash" />

  <!-- Stage 1: TO DO -->
  <g transform="translate(45, 48)" class="pulse-node">
    <rect x="0" y="0" width="190" height="124" rx="18" fill="#14151C" stroke="#3F3F46" stroke-width="1.5" />
    <circle cx="24" cy="26" r="5" fill="#A1A1AA" />
    <text x="38" y="30" class="font-ui" fill="#F4F4F5" font-size="14" font-weight="700">1. To Do</text>
    <text x="16" y="56" class="font-ui" fill="#A1A1AA" font-size="11">Backlog &amp; Sprint Queue</text>
    <rect x="16" y="76" width="158" height="30" rx="8" fill="#1F2029" />
    <text x="28" y="95" class="font-code" fill="#D4D4D8" font-size="10">Priority + Due Timer</text>
  </g>

  <!-- Stage 2: IN PROGRESS -->
  <g transform="translate(285, 48)" class="pulse-node">
    <rect x="0" y="0" width="190" height="124" rx="18" fill="#14151C" stroke="#0A84FF" stroke-width="1.5" />
    <circle cx="24" cy="26" r="5" fill="#0A84FF" />
    <text x="38" y="30" class="font-ui" fill="#F4F4F5" font-size="14" font-weight="700">2. In Progress</text>
    <text x="16" y="56" class="font-ui" fill="#93C5FD" font-size="11">Active Execution (Doing)</text>
    <rect x="16" y="76" width="158" height="30" rx="8" fill="#0A84FF" fill-opacity="0.14" />
    <text x="28" y="95" class="font-code" fill="#60A5FA" font-size="10">Subtasks &amp; Up Next</text>
  </g>

  <!-- Stage 3: IN REVIEW (CODE) -->
  <g transform="translate(525, 48)" class="pulse-node">
    <rect x="0" y="0" width="190" height="124" rx="18" fill="#14151C" stroke="#BF5AF2" stroke-width="1.5" />
    <circle cx="24" cy="26" r="5" fill="#BF5AF2" />
    <text x="38" y="30" class="font-ui" fill="#F4F4F5" font-size="14" font-weight="700">3. In Review</text>
    <text x="16" y="56" class="font-ui" fill="#D8B4FE" font-size="11">Code &amp; Pull Request</text>
    <rect x="16" y="76" width="158" height="30" rx="8" fill="#BF5AF2" fill-opacity="0.15" />
    <text x="28" y="95" class="font-code" fill="#C084FC" font-size="10">Branch &amp; PR Badges</text>
  </g>

  <!-- Stage 4: DONE -->
  <g transform="translate(765, 48)" class="pulse-node">
    <rect x="0" y="0" width="190" height="124" rx="18" fill="#14151C" stroke="#30D158" stroke-width="1.5" />
    <circle cx="24" cy="26" r="5" fill="#30D158" />
    <text x="38" y="30" class="font-ui" fill="#F4F4F5" font-size="14" font-weight="700">4. Done</text>
    <text x="16" y="56" class="font-ui" fill="#86EFAC" font-size="11">Verified &amp; Shipped</text>
    <rect x="16" y="76" width="158" height="30" rx="8" fill="#30D158" fill-opacity="0.15" />
    <text x="28" y="95" class="font-code" fill="#4ADE80" font-size="10">Velocity Ring +100%</text>
  </g>
</svg>
